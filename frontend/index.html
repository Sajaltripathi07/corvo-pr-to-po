<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corvo Procurement Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <div class="brand">Corvo Procurement Desk<span id="polbadge" class="pill"></span></div>
  <nav id="nav"></nav>
  <div class="who">
    <input id="user" aria-label="Your name" placeholder="Your name">
    <select id="role" aria-label="Role">
      <option value="requester">Requester</option>
      <option value="buyer">Buyer</option>
      <option value="procurement">Procurement head</option>
    </select>
  </div>
</header>
<div id="banner"></div>
<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
